<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bejelentkezés</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100;300;400;500;600;700;900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!-- 🟢 PocketBase script törölve -->
    <script src="script.js" defer></script>
</head>
<body class="login-bg">
    <div class="toastContainer"></div>
    
    <div class="upper">
        <div class="logo">
            <img src="user.png" alt="Logo">
            <p>Adatbázis kezelő</p>
        </div>
        <h1>Bejelentkezés</h1>
        <p>Lépj be a megadott adataiddal.</p>
    </div>

    <form class="login" id="login-form" onsubmit="event.preventDefault(); return false;">
        <div class="main">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="pl. xy@yx.hu" required>

            <label for="pwd">Jelszó</label>
            <input type="password" id="pwd" placeholder="••••••••" required>
        </div>

        <div class="btns">
            <label class="rememberBox">
                <input type="checkbox" id="rememberMe" name="rememberMe" value="Yes">
                <span>Emlékezz rám</span>
            </label>
            <a href="#">Elfelejtetted a jelszavad?</a>
        </div> 

        <!-- 🟢 Hozzáadva: type="submit" -->
        <button type="submit" class="loginbtn" id="btnlogin">Bejelentkezés</button>       
    </form>

    <div class="regpart">
        <img src="key.png" alt="Key">
        <p>Regisztráció</p>
    </div>
</body>
</html>
