<!doctype html>
<html lang="hu" data-theme="sajatTema">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-bold-rounded/css/uicons-bold-rounded.css'>
    <link rel="stylesheet" href="/src/app.css" defer>
    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes slideIn {from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut {from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-100%); } }
        .my-toast.fade-out { animation: fadeOut 0.5s ease forwards !important; }
        .my-toast { animation: slideIn 0.5s ease forwards !important; }
    </style>
  </head>
  <body class="bg-[rgb(247,247,247)] min-h-screen flex flex-row">
    <div class="toastContainer fixed z-9999 top-5 left-1/2 -translate-x-1/2"></div>
    <div class="z-2 flex flex-col bg-[rgb(241,241,241)] w-60 px-2 pb-2 pt-4 h-screen shadow-[0_2px_6px_rgba(0,0,0,0.3)] box-border">
      <div class="flex flex-row items-center justify-center gap-5 border-b border-b-[rgb(237,235,233)] -mx-2 pl-4 pr-4 pb-2 w-60">
        <img src="user.png" class="w-[50px] h-auto">
        <p class="font-bold text-[16px]">Adatbázis kezelő<br><span class="!font-thin text-[13px]">v0.1</span></p>
      </div>
      <div>
        <div class="profilee flex flex-row items-center gap-5 border-b border-b-[rgb(237,235,233)] -mx-2 pl-4 pr-4 pb-2 pt-2 w-60">
          <p class="avatarr">??</p>
          <p id="username">Betöltés...<br><span class="rang">Betöltés...</span></p>
        </div>
      </div>
      <ul class="menu h-full font-semibold text-neutral [&>li>a]:hover:bg-white [&>li]:mb-2 [&>li]:text-[15px] [&>li]:hover:text-primary [&>li]:border-[rgb(237, 235, 233)] [&>li]:hover:shadow-[0_2px_6px_rgba(0,0,0,0.067)]">
        <li class="active"><a><i class="fi fi-br-home"></i>Kezdőlap</a></li>
        <li><a href="users.html"><i class="fi fi-br-users-alt"></i>Felhasználók</a></li>
        <li><a href="settings.html"><i class="fi fi-br-user-gear"></i>Beállítások</a></li>
        <li><a href="systemsettings.html"><i class="fi fi-br-settings-window"></i>Rendszerbeállítások</a></li>
        <li class="mt-auto" id="logoutbtn"><a class="!text-[var(--color-mainred)]"><i class="fi fi-br-sign-out-alt"></i>Kijelentkezés</a></li>
      </ul>
    </div>
    <div class="flex flex-col w-full">
      <div class="z-1 bg-white w-full h-max box-border mr-auto py-4 px-6 border-b border-b-[rgb(237,235,233)]">
        <p class="font-semibold text-neutral text-lg">Kezdőlap</p>
      </div>
      <div class="p-15 flex flex-row gap-25 justify-center">
        <div class="indicator">
          <span class="indicator-item indicator-center badge badge-success">Jelenlévő felhasználók</span>
          <div class="stats shadow">
            <div class="stat !bg-white w-50 flex flex-col items-center">
              <div class="stat-value"><span id="activeusers"></span> <span class="font-thin text-base">fő</span></div>
              <div class="stat-desc">A teljes állomány x %-a</div>
            </div>
          </div>
        </div>

        <div class="indicator">
          <span class="indicator-item indicator-center badge badge-warning">Betegszabadságon</span>
          <div class="stats shadow">
            <div class="stat !bg-white w-50 flex flex-col items-center">
              <div class="stat-value">x <span class="font-thin text-base">fő</span></div>
              <div class="stat-desc">A teljes állomány x %-a</div>
            </div>
          </div>
        </div>

        <div class="indicator">
          <span class="indicator-item indicator-center badge badge-error">Leszerelt felhasználók</span>
          <div class="stats shadow">
            <div class="stat !bg-white w-50 flex flex-col items-center">
              <div class="stat-value">x <span class="font-thin text-base">fő</span></div>
              <div class="stat-desc">A teljes állomány x %-a</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
