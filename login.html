<!DOCTYPE html>
<html lang="hu" data-theme="sajatTema">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bejelentkezés</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/app.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes slideIn {from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut {from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-100%); } }
        .my-toast.fade-out { animation: fadeOut 0.5s ease forwards !important; }
        .my-toast { animation: slideIn 0.5s ease forwards !important; }
    </style>
</head>
<body class="bg-base-200 min-h-screen flex flex-col items-center justify-center p-4 gap-6">
    <!-- Toast üzenetek konténere -->
    <div class="toastContainer fixed z-9999 top-5 left-1/2 -translate-x-1/2"></div>

    <!-- Felső Címsor és Logo -->
    <div class="text-center flex flex-col items-center">
        <div class="flex items-center gap-3 mb-2">
            <img src="user.png" alt="Logo" class="w-16 h-auto">
            <p class="text-xl font-semibold">Adatbázis kezelő</p>
        </div>
        <h1 class="text-3xl font-bold tracking-tight mt-1">Bejelentkezés</h1>
        <p class="text-base-content/70 text-sm mt-1">Lépj be a megadott adataiddal.</p>
    </div>

    <!-- Fő Bejelentkező Kártya -->
    <div class="card w-full max-w-md bg-base-100 shadow-xl border border-base-200">
        <form class="card-body gap-4" id="login-form" onsubmit="event.preventDefault(); return false;">
            
            <!-- E-mail mező -->
            <div class="form-control w-full">
                <label class="label"><span class="fieldset-legend font-medium">E-mail</span></label>
                <input type="email" id="email" placeholder="pl. xy@yx.hu" class="input input-bordered w-full" required>
            </div>

            <!-- Jelszó mező -->
            <div class="form-control w-full">
                <label class="label"><span class="fieldset-legend font-medium">Jelszó</span></label>
                <input type="password" id="pwd" placeholder="••••••••" class="input input-bordered w-full focus:border-base-200" required>
            </div>

            <!-- Emlékezz rám & Elfelejtett jelszó -->
            <div class="flex items-center justify-between text-sm mt-1">
                <label class="cursor-pointer flex items-center gap-2">
                    <input type="checkbox" id="rememberMe" name="rememberMe" class="checkbox checkbox-primary checkbox-sm" value="Yes">
                    <span class="label-text">Emlékezz rám</span>
                </label>
                <a href="#" class="link link-primary no-underline hover:underline">Elfelejtetted a jelszavad?</a>
            </div> 

            <!-- Bejelentkezés Gomb -->
            <div class="card-actions mt-2">
                <button type="submit" class="btn btn-primary w-full" id="btnlogin">Bejelentkezés</button>      
            </div>
        </form>
    </div>

    <!-- Alsó Regisztrációs Sáv -->
    <button class="card w-full max-w-md bg-base-100 shadow-md border border-base-200 p-4 flex flex-row items-center gap-4 hover:bg-base-200 transition-colors cursor-pointer" onclick="reg_modal.showModal()">
        <img src="key.png" alt="Key" class="w-6 h-auto">
        <p class="font-semibold text-base-content">Regisztráció</p>
    </button>
    <dialog id="reg_modal" class="modal">
        <div class="modal-box">
            <form method="dialog">
            <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
            </form>
            <h3 class="text-lg font-bold text-center">Regisztráció</h3>
            <form class="card-body gap-4" id="register-form">            
                <!-- Név -->
                <div class="form-control w-full">
                <label class="label"><span class="fieldset-legend font-medium">Teljes név</span></label>
                <input type="text" id="reg_name" placeholder="Kiss Jakab" class="input input-bordered w-full" >
                </div>

                <!-- E-mail mező -->
                <div class="form-control w-full">
                    <label class="label"><span class="fieldset-legend font-medium">E-mail</span></label>
                    <input type="email" id="reg_email" placeholder="xy@yx.hu" class="input input-bordered w-full" >
                </div>

                <!-- Jelszó mező -->
                <div class="form-control w-full">
                    <label class="label"><span class="fieldset-legend font-medium">Jelszó</span></label>
                    <input type="password" id="reg_pwd1" placeholder="••••••••" class="input input-bordered w-full focus:border-base-200" >
                </div>

                <div class="form-control w-full">
                    <label class="label"><span class="fieldset-legend font-medium">Jelszó mégegyszer</span></label>
                    <input type="password" id="reg_pwd2" placeholder="••••••••" class="input input-bordered w-full focus:border-base-200" >
                </div>

                <!-- Adatvédelem -->
                <div class="flex items-center justify-between text-sm mt-1">
                    <label class="cursor-pointer flex items-center gap-2">
                        <input type="checkbox" id="reg_adatvedelem" name="adatvelem_elfogadasa" class="checkbox checkbox-primary checkbox-sm" value="Yes">
                        <p class="label-text font-medium">Adatvédelmi tájékoztató elfogadása</p>
                    </label>
                </div> 

                <!-- Regisztráció Gomb -->
                <div class="card-actions mt-2">
                    <button type="submit" class="btn btn-primary w-full" id="regbtn">Regisztráció</button>      
                </div>
            </form>
        </div>
    </dialog>
<script type="module" src="/src/main.js"></script>
</body>
</html>
