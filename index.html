<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100;300;400;500;600;700;900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script type="module" src="src/script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-bold-rounded/css/uicons-bold-rounded.css'>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pocketbase/0.21.1/pocketbase.umd.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="index-bg">
    <div class="navigation">
        <div class="name">
            <img src="user.png">
            <p>Adatbázis kezelő<br><span id="version">v0.5</span></p>
        </div>
        <div class="navilist">
            <ul class="naviul">
                <div class="profile" style="border-bottom: 1px solid rgb(237, 235, 233);margin-left: -15px;margin-right:-15px;padding-left: 15px;padding-right:15px;padding-bottom: 10px">
                    <p class="avatar">??</p>
                    <p id="username">Betöltés...<br><span class="rang">Betöltés...</span></p>
                </div>
                <a href="#"><li class="activenavi"><i class="fi fi-br-home"></i>Kezdőlap</li></a>
                <a href="#"><li><i class="fi fi-br-users-alt"></i>Felhasználók</li></a>
                <a href="#"><li><i class="fi fi-br-user-gear"></i>Beállítások</li></a>
                <a href="#"><li><i class="fi fi-br-settings-window"></i>Rendszerbeállítások</li></a>
                <a href="#" target="_blank" id="adminLink"><li id="adminMenu" class="hidden"><i class="fi fi-br-limit-hand"></i>Admin felület</li></a>
            </ul>
            <ul style="border-top: 1px solid rgb(237, 235, 233);margin-left: -15px;margin-right:-15px;padding-left: 15px;padding-right:15px;padding-top: 10px">
                <li id="logoutbtn"><i class="fi fi-br-sign-out-alt"></i>Kijelentkezés</li>
            </ul>
        </div>
    </div>
    <div class="container">
        <div class="header"><h1>Kezdőlap</h1></div>
        <div class="stats">
                <div class="badge">
                    <p class="statname activeusers">AKTÍV FELHASZNÁLÓK</p>
                    <p class="badgeholder"><span class="activeusers num">142</span> Fő</p>
                </div>
                <div class="badge">
                    <p class="statname">Inaktív felhasználók:</p>
                    <p class="badgeholder"><span class="inactiveusers num">12</span> Fő</p>
                </div>
                <div class="badge">
                    <p class="statname">Törölt felhasználók:</p>
                    <p class="badgeholder"><span class="deletedusers num">4</span> Fő</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
